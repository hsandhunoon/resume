<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honey Sandhu — Fulfillment Supervisor</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fb;--fg:#12131c;--mut:#585d76;--ac:#b88400;--ac2:#5b45e6;--ac3:#d83a78;--card:#fff;--line:rgba(18,19,28,.13);--glass:rgba(255,255,255,.72);--sky1:#d6e6ff;--sky2:#f3f0ff;--bld:#b3bee0;--road:#4a4f66;--f:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07080e;--fg:#eef0f8;--mut:#9ba0b8;--ac:#ffd60a;--ac2:#8b7bff;--ac3:#ff5d9e;--card:#12141f;--line:rgba(255,255,255,.11);--glass:rgba(18,20,32,.66);--sky1:#0d1230;--sky2:#202859;--bld:#121836;--road:#171a28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07080e;--fg:#eef0f8;--mut:#9ba0b8;--ac:#ffd60a;--ac2:#8b7bff;--ac3:#ff5d9e;--card:#12141f;--line:rgba(255,255,255,.11);--glass:rgba(18,20,32,.66);--sky1:#0d1230;--sky2:#202859;--bld:#121836;--road:#171a28;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.65 var(--f);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.02em}
.eb{font:600 11px var(--f);letter-spacing:.22em;text-transform:uppercase;color:var(--ac)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#aur{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#aur i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.26;animation:drift 22s ease-in-out infinite alternate}
#aur i:nth-child(1){background:var(--ac2);left:-15%;top:-10%}
#aur i:nth-child(2){background:var(--ac3);right:-20%;top:30%;animation-delay:-8s;opacity:.16}
#aur i:nth-child(3){background:var(--ac);left:20%;bottom:-30%;animation-delay:-14s;opacity:.1}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#glow{position:fixed;left:0;top:0;width:380px;height:380px;margin:-190px 0 0 -190px;background:radial-gradient(color-mix(in srgb,var(--ac) 14%,transparent),transparent 65%);pointer-events:none;z-index:1;will-change:transform}
@media (pointer:coarse){#glow{display:none}}
#cf{position:fixed;inset:0;z-index:80;pointer-events:none}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:min(580px,calc(100% - 24px));z-index:50;padding:10px 16px;display:flex;gap:14px;align-items:center;border-radius:99px;font:600 11px/1 var(--f);letter-spacing:.08em}
.hud .lv{color:var(--ac);min-width:92px}
.hud .bar{flex:1;height:5px;background:var(--line);border-radius:9px;overflow:hidden}
.hud .bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--ac2),var(--ac3),var(--ac))}
.hud .xp{min-width:36px;text-align:right}
.hud button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.hud button:focus-visible{outline:2px solid var(--ac)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translate(-50%,-24px);opacity:0;z-index:55;padding:12px 20px;font-size:13px;transition:.5s;pointer-events:none;max-width:92vw;text-align:center;border-color:var(--ac)}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast b{color:var(--ac)}
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:100px 20px 170px;perspective:900px;position:relative;overflow:hidden;z-index:2}
.stage{transform-style:preserve-3d;transition:transform .15s ease-out;position:relative;z-index:3}
.ring{position:relative;width:clamp(120px,28vw,172px);aspect-ratio:1;border-radius:50%;padding:4px;overflow:hidden;margin:0 auto;transform:translateZ(60px);box-shadow:0 20px 60px color-mix(in srgb,var(--ac2) 40%,transparent)}
.ring::before{content:"";position:absolute;inset:-50%;background:conic-gradient(var(--ac),var(--ac2),var(--ac3),var(--ac));animation:rot 6s linear infinite}
.ring img{position:relative;width:100%;height:100%;border-radius:inherit;object-fit:cover;display:block;border:4px solid var(--bg);background:#fff}
.ring.sq{border-radius:30px;flex:none;margin:0}
@keyframes rot{to{transform:rotate(360deg)}}
.hero h1{font:800 clamp(40px,10vw,96px)/1 var(--f);margin:26px 0 14px;background:linear-gradient(100deg,var(--fg) 35%,var(--ac) 75%,var(--ac3));-webkit-background-clip:text;background-clip:text;color:transparent;transform:translateZ(70px);padding-bottom:.06em}
#hTag{color:var(--mut);max-width:520px;margin:0 auto;font-size:18px;transform:translateZ(30px)}
.hc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.mouse{width:24px;height:38px;border:2px solid var(--mut);border-radius:14px;margin:28px auto 0;position:relative}
.mouse::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--ac);animation:mw 1.6s infinite}
@keyframes mw{60%{transform:translateY(12px);opacity:0}}
.heroroad{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:2}
.wrap{max-width:860px;margin:0 auto;padding:0 20px;position:relative;z-index:2}
.sec{padding:70px 0}
.sec h2.big{font:800 clamp(28px,5vw,44px)/1.1 var(--f);margin-bottom:8px}
.sub{color:var(--mut);margin:0 0 26px}
.pcard{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pcard .sub{flex:1;min-width:240px;margin:0;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:26px}
.stat,.tile{padding:16px 20px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.stat b,.tile b{display:block;font:800 34px/1.2 var(--f);color:var(--ac)}
.stat span,.tile span{font-size:13px;color:var(--mut)}
.track{position:relative;padding-left:34px;margin:40px 0}
.track::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--line)}
.fill{position:absolute;left:7px;top:0;width:2px;height:0;background:linear-gradient(var(--ac2),var(--ac3),var(--ac));box-shadow:0 0 14px var(--ac)}
.plr{position:absolute;left:8px;top:0;font-size:24px;transform:translate(-50%,-50%);z-index:3;transition:top .12s linear;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.lvl{position:relative;padding:44px 0 56px}
.node{position:absolute;left:-34px;top:52px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--line);transition:.5s}
.lvl.on .node{border-color:var(--ac);background:var(--ac);box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 22%,transparent)}
.lvl h2{font:800 clamp(30px,6vw,52px)/1.05 var(--f);margin:10px 0 6px}
.yrs{color:var(--mut);font-size:14px;margin:0 0 10px}
.tx{max-width:580px;font-size:18px;margin:0}
.pts{list-style:none;margin:0;padding:18px 22px}
.pts li{position:relative;padding-left:20px;margin:7px 0;color:var(--mut)}
.pts li::before{content:"";position:absolute;left:0;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--ac)}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.ch{margin-top:18px;max-width:460px}
.ch .row{display:flex;justify-content:space-between;gap:10px}
.hp{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}
.hp i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac3),var(--ac));transition:width 2.4s .5s cubic-bezier(.3,.7,.2,1)}
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}.rv.d3{transition-delay:.3s}
/* scenes */
.scene{position:relative;height:190px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(var(--sky1),var(--sky2));margin:18px 0 20px}
.scene:not(.live) *,.scene:not(.live) *::after{animation-play-state:paused!important}
.city{position:absolute;left:0;bottom:46px;width:100%;height:90px;fill:var(--bld);opacity:.9}
.lane{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--road)}
.lane::after{content:"";position:absolute;left:0;right:0;top:21px;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 24px,transparent 24px 48px);animation:dash 1s linear infinite}
@keyframes dash{to{background-position:-48px 0}}
.heroroad{background:none;border:0;border-radius:0;margin:0}
.heroroad .lane{background:color-mix(in srgb,var(--road) 80%,transparent)}
.veh{position:absolute;bottom:5px;width:120px;left:-150px;animation:drive var(--d) linear infinite;animation-delay:var(--dl);filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.veh.far{width:96px;bottom:14px;opacity:.85}
@keyframes drive{to{left:calc(100% + 10px)}}
.wh{animation:spin .55s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.pin{position:absolute;top:16px;padding:4px 11px 4px 22px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:11px;font-weight:600;white-space:nowrap;transform:translateX(-50%)}
.pin::before{content:"";position:absolute;left:8px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--ac);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.belt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 79px,var(--line) 79px 80px)}
.lab{position:absolute;left:16px;top:14px;color:var(--mut);font:600 11px var(--f);letter-spacing:.2em}
.lab.b{top:64px}
.bl{position:absolute;left:0;right:0;bottom:24px;height:12px;background:var(--road);border-top:2px solid var(--line)}
.bl.l2{bottom:74px}
.scan{position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(transparent,var(--ac),transparent);box-shadow:0 0 18px var(--ac);animation:glw 2s ease-in-out infinite}
@keyframes glw{50%{opacity:.4}}
.bx{position:absolute;bottom:36px;width:46px;left:-60px;animation:flow var(--d) linear infinite;animation-delay:var(--dl)}
.bx.l2{bottom:86px}
.bx.rev{left:100%;animation-name:flowR}
@keyframes flow{to{left:100%}}
@keyframes flowR{to{left:-60px}}
.bx b{position:absolute;right:-6px;top:-10px;width:20px;height:20px;border-radius:50%;background:#22c55e;color:#fff;font-size:12px;display:grid;place-items:center;opacity:0;animation:chk var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes chk{0%,48%{opacity:0;transform:scale(.4)}52%,100%{opacity:1;transform:scale(1)}}
.yard .bx{bottom:52px;width:30px}
.yard .chute{left:14%;animation:chute var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes chute{0%{left:12%;opacity:0}12%,88%{opacity:1}100%{left:25%;opacity:0}}
.wb{position:absolute;left:4%;bottom:46px;width:30%;height:100px;background:var(--bld);border:1px solid var(--line);border-radius:12px 12px 0 0}
.wb span{position:absolute;left:10px;top:8px;font:600 10px var(--f);letter-spacing:.18em;color:var(--mut)}
.wb i{position:absolute;bottom:0;width:22%;height:46px;background:var(--bg);border:1px solid var(--line);border-bottom:0}
.wb i:nth-of-type(1){left:7%}.wb i:nth-of-type(2){left:39%}.wb i:nth-of-type(3){left:71%}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.pc{perspective:800px;height:230px}
.tilt{width:100%;height:100%;transition:transform .15s ease-out;transform-style:preserve-3d}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1);cursor:pointer;border-radius:20px}
.flip:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.pc.open .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.face.f::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(var(--ac2),transparent 70%);opacity:.5}
.face.k{transform:rotateY(180deg);border-color:var(--ac)}
.face h3{font-size:24px;margin-top:8px}
.face small{color:var(--ac);font:600 10px var(--f);letter-spacing:.2em}
.face p{margin:8px 0 0;color:var(--mut);font-size:15px}
.hint{font-size:12px;color:var(--mut)}
.trophies{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tr{perspective:700px}
.tr>div{position:relative;overflow:hidden;background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:20px;text-align:center;transition:transform .15s ease-out,border-color .6s,box-shadow .6s;filter:grayscale(1);opacity:.5}
.tr.on>div{filter:none;opacity:1;border:1px solid var(--ac);box-shadow:0 10px 40px color-mix(in srgb,var(--ac) 25%,transparent)}
.tr.on>div::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.5s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.tr .ic{font-size:34px}.tr b{display:block;margin:6px 0 2px}.tr span{font-size:12px;color:var(--mut)}
.sub2{margin:34px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:8px 15px;border:1px solid var(--line);background:var(--glass);border-radius:99px;font-size:14px;transition:transform .2s,border-color .2s}
.chip:hover{transform:translateY(-4px);border-color:var(--ac)}
.chip.lang{border-color:var(--ac2)}
.credits{text-align:center;padding:90px 20px 110px;position:relative;z-index:2}
.credits h2{font:800 clamp(28px,6vw,56px)/1.1 var(--f)}
.credits p{color:var(--mut)}
.endwrap{max-width:860px;margin:0 auto 34px}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:15px 28px;border-radius:99px;background:linear-gradient(100deg,var(--ac),#ffb300);color:#111;font-weight:800;text-decoration:none;box-shadow:0 10px 40px color-mix(in srgb,var(--ac) 35%,transparent);transition:transform .2s}
.cta:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.veh{left:55%!important}.bx{left:45%!important}.bx b{opacity:1}}
</style>
</head>
<body>
<div id="aur"><i></i><i></i><i></i></div>
<div id="glow"></div><canvas id="cf"></canvas>
<div class="hud glass" role="banner">
  <span class="lv" id="lv">CHAPTER 0/4</span>
  <div class="bar"><i id="pbar"></i></div>
  <span class="xp" id="xp">0%</span>
  <button id="theme" aria-label="Toggle theme">◐</button>
</div>
<div class="toast glass" id="toast" role="status"></div>

<header class="hero" id="hero">
  <div class="stage" id="stage">
    <div class="ring"><img class="me" data-me alt="Honey Sandhu"></div>
    <h1 id="hName"></h1>
    <div class="eb" id="hRole"></div>
    <p id="hTag" style="margin-top:14px"></p>
    <div class="hc" id="hChips"></div>
    <div class="mouse"></div>
  </div>
  <div class="scene heroroad" id="heroRoad"></div>
</header>

<main class="wrap">
  <section class="sec" style="padding-bottom:0">
    <h2 class="big rv">The Journey</h2>
    <div class="pcard rv d1"><div class="ring sq"><img class="me" data-me alt="Honey Sandhu"></div><p class="sub" id="sum"></p></div>
    <div class="tiles rv d2" id="tiles"></div>
  </section>

  <div class="track" id="track"><div class="fill" id="fill"></div><div class="plr" id="plr">🚚</div></div>

  <section class="sec">
    <h2 class="big rv">Signature Projects</h2>
    <p class="sub rv d1">Tap or press Enter to flip a card. Hover to tilt.</p>
    <div class="grid" id="projects"></div>
  </section>

  <section class="sec">
    <h2 class="big rv">Awards</h2>
    <p class="sub rv d1">Each one unlocks as you reach the chapter where it was earned.</p>
    <div class="trophies" id="trophies"></div>
  </section>

  <section class="sec">
    <h2 class="big rv">Toolkit</h2>
    <p class="sub rv d1">Skills collected along the way.</p>
    <div class="chips rv d2" id="skills"></div>
    <div class="eb sub2 rv">Languages</div>
    <div class="chips rv" id="langs"></div>
  </section>
</main>

<footer class="credits">
  <div class="endwrap rv"><div class="scene" id="endRoad"></div></div>
  <div class="eb rv">Delivered ✓</div>
  <h2 class="rv d1">Thanks for stopping by.</h2>
  <p class="rv d2" id="cTx"></p>
  <a class="cta rv d3" id="cLink" href="#">Let’s connect →</a>

const boxes = (n,d,c="") => Array.from({length:n}, (_,i) => `<div class="bx ${c}" style="--d:${d}s;--dl:${-(d/n)*i}s">${BOX}<b>✓</b></div>`).join("");
const SCENES = {
  road: () => `<div class="scene">${CITY}<span class="pin" style="left:16%">Pickup</span><span class="pin" style="left:50%">In transit</span><span class="pin" style="left:84%">Delivered ✓</span>${lane}${veh(TRUCK("#ff8a3d"),12,0)}${veh(TRUCK("#4da3ff"),17,-8,"far")}</div>`,
  qa: () => `<div class="scene belt"><span class="lab">QA AUDIT · PASS / FAIL</span><div class="scan"></div><div class="bl"></div>${boxes(5,10)}</div>`,
  io: () => `<div class="scene belt"><span class="lab">INBOUND ➜</span><span class="lab b">⬅ OUTBOUND</span><div class="scan"></div><div class="bl"></div><div class="bl l2"></div>${boxes(4,11)}${boxes(4,13,"rev l2")}</div>`,
  yard: () => `<div class="scene yard"><div class="wb"><span>FULFILMENT CENTRE</span><i></i><i></i><i></i></div><span class="pin" style="left:62%">Dispatch</span><span class="pin" style="left:88%">Out for delivery</span>${lane}${[0,1,2].map(i => `<div class="bx chute" style="--d:3.2s;--dl:${-i*1.07}s">${BOX}</div>`).join("")}${veh(VAN,10,0)}${veh(VAN,13,-5)}${veh(VAN,16,-11,"far")}</div>`
};

const $ = s => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const pad = n => String(n).padStart(2,"0");
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

document.title = CFG.name + " — " + CFG.role;
$("#hName").textContent = CFG.name;
$("#hRole").textContent = CFG.role + " · " + CFG.loc;
$("#hTag").textContent = CFG.tagline;
$("#cTx").textContent = CFG.credits;
$("#sum").textContent = CFG.summary;
$("#cLink").href = "mailto:" + CFG.email;
document.querySelectorAll("[data-me]").forEach(i => i.src = PHOTO);
$("#hChips").innerHTML = CFG.chips.map(c => `<span class="chip">${c}</span>`).join("");
$("#heroRoad").innerHTML = lane + veh(VAN,15,0) + veh(TRUCK("#ff8a3d"),21,-9,"far");
$("#endRoad").innerHTML = CITY + lane + veh(VAN,9,0) + veh(TRUCK("#ff8a3d"),14,-6,"far");

const stat = (t,c) => `<div class="${c}"><b data-to="${t.n}" data-s="${t.s}">0${t.s}</b><span>${t.l}</span></div>`;
$("#tiles").innerHTML = CFG.card.map(t => stat(t,"tile")).join("");

const track = $("#track");
CFG.levels.forEach((L,i) => {
  const s = document.createElement("section");
  s.className = "lvl";
  s.innerHTML = `<span class="node"></span>
    <div class="eb rv">Chapter ${pad(i+1)}</div>
    <h2 class="rv d1">${L.title}</h2>
    <p class="yrs rv d1">${L.years}</p>
    <p class="tx rv d2">${L.text}</p>
    <div class="rv d2">${SCENES[L.scene]()}</div>
    <ul class="pts glass rv d2">${L.points.map(p => `<li>${p}</li>`).join("")}</ul>
    ${L.stats.length ? `<div class="stats rv d3">${L.stats.map(t => stat(t,"stat")).join("")}</div>` : ""}
    <div class="ch rv d3"><div class="row"><span class="eb" style="color:var(--ac3)">Challenge · ${L.boss.n}</span><span class="eb">${L.boss.t}</span></div><div class="hp"><i data-hp="${L.boss.hp}"></i></div></div>`;
  track.appendChild(s);
});

function tiltable(d,t) {
  if (reduce) return;
  d.addEventListener("pointermove", e => {
    if (e.pointerType === "touch") return;
    const r = d.getBoundingClientRect();
    t.style.transform = `rotateY(${((e.clientX-r.left)/r.width-.5)*14}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*14}deg)`;
  });
  d.addEventListener("pointerleave", () => t.style.transform = "");
}
CFG.projects.forEach((p,i) => {
  const d = document.createElement("div");
  d.className = "pc rv d" + Math.min(i+1,3);
  d.innerHTML = `<div class="tilt"><div class="flip" tabindex="0" role="button" aria-pressed="false">
    <div class="face f"><div><small>${p.tag}</small><h3>${p.name}</h3><p>${p.blurb}</p></div><span class="hint">Tap to reveal ↻</span></div>
    <div class="face k"><div><small>${p.stack}</small><p>${p.detail}</p></div><span class="hint">Tap to flip back ↻</span></div>
  </div></div>`;
  $("#projects").appendChild(d);
  const flip = d.querySelector(".flip");
  const toggle = () => flip.setAttribute("aria-pressed", d.classList.toggle("open"));
  flip.addEventListener("click", toggle);
  flip.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  tiltable(d, d.querySelector(".tilt"));
});
CFG.awards.forEach((a,k) => {
  const d = document.createElement("div");
  d.className = "tr rv d" + (k % 4);
  d.id = "a" + k;
  d.innerHTML = `<div><div class="ic">🔒</div><b>${a.t}</b><span>${a.d}</span></div>`;
  $("#trophies").appendChild(d);
  tiltable(d, d.firstChild);
});
CFG.skills.forEach(s => { const c = document.createElement("span"); c.className = "chip"; c.textContent = s; $("#skills").appendChild(c); });
CFG.langs.forEach(s => { const c = document.createElement("span"); c.className = "chip lang"; c.textContent = s; $("#langs").appendChild(c); });

// Confetti
const cf = $("#cf"), cc = cf.getContext("2d");
let P = [], run = 0;
function burst() {
  if (reduce) return;
  cf.width = innerWidth; cf.height = innerHeight;
  const cols = ["--ac","--ac2","--ac3"].map(cssv);
  for (let i = 0; i < 80; i++) P.push({x: innerWidth/2, y: innerHeight*.4, vx: (Math.random()-.5)*14, vy: Math.random()*-11-3, c: cols[i%3], r: Math.random()*6+3, l: 1});
  if (!run) { run = 1; fall(); }
}
function fall() {
  cc.clearRect(0,0,cf.width,cf.height);
  P = P.filter(p => p.l > 0);
  P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.l -= .013; cc.globalAlpha = Math.max(p.l,0); cc.fillStyle = p.c; cc.fillRect(p.x,p.y,p.r,p.r); });
  if (P.length) requestAnimationFrame(fall); else { run = 0; cc.clearRect(0,0,cf.width,cf.height); }
}

// Reveal, counters, challenge bars, scene play/pause
function count(el) {
  const to = parseFloat(el.dataset.to), suf = el.dataset.s;
  if (reduce) { el.textContent = to + suf; return; }
  const t0 = performance.now();
  (function step(t) {
    const k = Math.min((t-t0)/1600,1);
    el.textContent = Math.round(to*(1-Math.pow(1-k,3))) + suf;
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
const io = new IntersectionObserver(es => es.forEach(en => {
  if (!en.isIntersecting) return;
  en.target.classList.add("in");
  en.target.querySelectorAll("[data-to]").forEach(count);
  en.target.querySelectorAll("[data-hp]").forEach(b => { b.style.width = b.dataset.hp + "%"; });
  io.unobserve(en.target);
}), {threshold:.2});
document.querySelectorAll(".rv").forEach(el => io.observe(el));
const sio = new IntersectionObserver(es => es.forEach(en => en.target.classList.toggle("live", en.isIntersecting)));
document.querySelectorAll(".scene").forEach(el => sio.observe(el));

// Chapters and awards
const levels = [...document.querySelectorAll(".lvl")];
const unlocked = new Set(), toast = $("#toast");
let tt;
function notify(html) {
  toast.innerHTML = html;
  toast.classList.add("show");
  clearTimeout(tt);
  tt = setTimeout(() => toast.classList.remove("show"), 3000);
}
const lio = new IntersectionObserver(es => es.forEach(en => {
  const i = levels.indexOf(en.target);
  if (!en.isIntersecting) return;
  en.target.classList.add("on");
  if (unlocked.has(i)) return;
  unlocked.add(i);
  const got = [];
  CFG.awards.forEach((a,k) => {
    const el = $("#a" + k);
    if (a.lv <= i && !el.classList.contains("on")) { el.classList.add("on"); el.querySelector(".ic").textContent = "🏆"; got.push(a.t); }
  });
  notify(`<b>Chapter ${pad(i+1)}</b> · ${CFG.levels[i].title}` + (got.length ? `<br>🏆 ${got.join(", ")}` : ""));
  if (got.length) burst();
}), {rootMargin:"-45% 0px -45% 0px"});
levels.forEach(l => lio.observe(l));

// Progress, HUD, moving marker
const fill = $("#fill"), plr = $("#plr");
let tick = false;
function onScroll() {
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max > 0 ? Math.min(scrollY/max,1) : 0;
  $("#pbar").style.width = (p*100) + "%";
  $("#xp").textContent = Math.round(p*100) + "%";
  const tr = track.getBoundingClientRect();
  const tp = Math.max(0, Math.min((innerHeight*.5 - tr.top)/tr.height, 1));
  fill.style.height = plr.style.top = (tp*100) + "%";
  let cur = 0;
  levels.forEach((l,i) => { if (l.getBoundingClientRect().top < innerHeight*.5) cur = i + 1; });
  $("#lv").textContent = "CHAPTER " + cur + "/" + levels.length;
  plr.textContent = CFG.levels[Math.max(cur-1,0)].icon;
  tick = false;
}
addEventListener("scroll", () => { if (!tick) { tick = true; requestAnimationFrame(onScroll); } }, {passive:true});
addEventListener("resize", onScroll);
onScroll();

// Hero parallax, cursor glow, theme
const stage = $("#stage");
if (!reduce) {
  $("#hero").addEventListener("pointermove", e => {
    stage.style.transform = `rotateY(${(e.clientX/innerWidth-.5)*12}deg) rotateX(${-(e.clientY/innerHeight-.5)*9}deg)`;
  });
  $("#hero").addEventListener("pointerleave", () => stage.style.transform = "");
  addEventListener("pointermove", e => { $("#glow").style.transform = `translate(${e.clientX}px,${e.clientY}px)`; });
}
$("#theme").addEventListener("click", () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
});
</script>
</body>
</html>
